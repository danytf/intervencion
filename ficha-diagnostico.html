  --sh-3:0 12px 40px rgba(0,0,0,.45);
}
/* Modo proyección: misma ficha, todo un paso más grande para leerlo en sala */
:root.proj{
  --t-xs:13.5px; --t-sm:15.5px; --t-md:17.5px; --t-base:18px; --t-lg:20px; --t-xl:23px; --t-2xl:32px; --t-3xl:40px; --t-rx:24px;
  --box:1480px; --aside-w:320px;
}

[data-tone="indigo"]{--tone:var(--t-indigo);--tone-soft:var(--t-indigo-soft);--tone-ink:var(--t-indigo);}
[data-tone="teal"]  {--tone:var(--t-teal);  --tone-soft:var(--t-teal-soft);  --tone-ink:var(--t-teal);}
[data-tone="slate"] {--tone:var(--t-slate); --tone-soft:var(--t-slate-soft); --tone-ink:var(--t-slate);}
[data-tone="rose"]  {--tone:var(--t-rose);  --tone-soft:var(--t-rose-soft);  --tone-ink:var(--t-rose);}
[data-tone="green"] {--tone:var(--t-green); --tone-soft:var(--t-green-soft); --tone-ink:var(--t-green);}
[data-tone="amber"] {--tone:var(--t-amber); --tone-soft:var(--t-amber-soft); --tone-ink:var(--t-amber-ink);}
[data-tone="blue"]  {--tone:var(--t-blue);  --tone-soft:var(--t-blue-soft);  --tone-ink:var(--t-blue);}
[data-tone="brand"] {--tone:var(--brand);   --tone-soft:var(--brand-soft);   --tone-ink:var(--brand-ink);}
[data-tone="neutral"]{--tone:var(--ink-2);  --tone-soft:var(--surface-hi);   --tone-ink:var(--ink);}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
*{-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--hdr-h) + 16px);scroll-padding-bottom:calc(var(--nav-h) + 24px);}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--t-md);line-height:1.5;min-height:100vh;overflow-wrap:break-word;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;touch-action:manipulation;}
[hidden]{display:none !important;}
h1,h2,h3,h4,.page-title,.card-title{text-wrap:balance;}
p,li,.desc{text-wrap:pretty;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.skip-link{position:absolute;left:12px;top:-60px;z-index:2000;background:var(--inverse);color:var(--inverse-ink);
  font-family:var(--font-brand);font-weight:700;font-size:var(--t-sm);padding:12px 16px;border-radius:var(--r-sm);text-decoration:none;}
.skip-link:focus{top:12px;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
:focus:not(:focus-visible){outline:none;}

.ic{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;}
.ic-sm{width:16px;height:16px;}
.ic-fill{fill:currentColor;stroke:none;}
.tile{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:40px;height:40px;border-radius:12px;
  background:var(--tone-soft,var(--surface-hi));color:var(--tone,var(--ink-2));}
.tile .ic{width:21px;height:21px;}
.tile-sm{width:36px;height:36px;border-radius:10px;}
.tile-sm .ic{width:19px;height:19px;}
.tile-xl{width:64px;height:64px;border-radius:18px;}
.tile-xl .ic{width:30px;height:30px;}
.tile-num{font-family:var(--font-brand);font-weight:800;font-size:var(--t-md);font-variant-numeric:tabular-nums;color:var(--tone-ink,var(--ink-2));}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--tone,var(--ink-3));}

/* ══════════ CABECERA ══════════ */
.box{width:100%;max-width:calc(var(--box) + 2 * var(--gutter));margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px));}
#site-header{position:sticky;top:0;z-index:200;background:var(--surface);border-bottom:1px solid var(--line);padding-top:var(--safe-t);}
.hdr-row{display:flex;align-items:center;gap:var(--s-3);min-height:var(--hdr-h);}
.hdr-brand{display:flex;align-items:center;gap:var(--s-3);min-width:0;flex:1;}
.hdr-logo{display:block;height:38px;width:auto;flex-shrink:0;}
.hdr-names{min-width:0;padding-left:var(--s-3);border-left:1px solid var(--line);line-height:1.3;}
.hdr-app{display:block;font-family:var(--font-brand);font-size:var(--t-2xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;}
.hdr-sub{display:block;margin-top:2px;font-size:var(--t-xs);font-weight:500;color:var(--ink-3);white-space:nowrap;}
.hdr-sub.bad{color:var(--bad);font-weight:600;}
.hdr-tabs{display:none;gap:var(--s-1);}
.hdr-tab{display:inline-flex;align-items:center;gap:var(--s-2);min-height:44px;padding:0 var(--s-4);border-radius:12px;
  font-family:var(--font-brand);font-size:var(--t-sm);font-weight:700;color:var(--ink-2);transition:background-color .15s var(--ease),color .15s var(--ease);}
.hdr-tab[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink);}
.hdr-actions{display:flex;align-items:center;gap:var(--s-1);flex-shrink:0;position:relative;}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;
  border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  transition:background-color .15s var(--ease),border-color .15s var(--ease);}
.icon-btn[aria-expanded="true"],.icon-btn[aria-pressed="true"]{background:var(--surface-hi);color:var(--ink);border-color:var(--line-2);}
.icon-btn .run-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid var(--surface);display:none;}
.timer-running .icon-btn .run-dot,.timer-running .nav-btn .run-dot{display:block;}
#btnTimerHdr{display:none;}

.hdr-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;width:max-content;min-width:272px;max-width:calc(100vw - 24px);z-index:500;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-3);padding:6px;}
.hdr-dropdown.open{display:block;animation:dropIn .15s var(--ease-out);}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.drop-item{display:flex;align-items:center;gap:var(--s-3);width:100%;min-height:48px;padding:0 var(--s-3);border-radius:10px;
  text-align:left;font-size:var(--t-md);font-weight:500;color:var(--ink);transition:background-color .15s var(--ease);}
.drop-item .ic{color:var(--ink-3);}
.drop-label{flex:1;}
.drop-badge{font-family:var(--font-brand);font-size:var(--t-xs);font-weight:700;color:var(--ink-2);background:var(--surface-hi);
  padding:2px 9px;border-radius:var(--r-pill);font-variant-numeric:tabular-nums;}
.drop-sep{height:1px;background:var(--line);margin:6px 4px;}
.drop-head{padding:10px var(--s-3) 4px;font-family:var(--font-brand);font-size:var(--t-2xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}

/* ══════════ NAVEGACIÓN INFERIOR (móvil y tablet en vertical) ══════════ */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -4px 16px rgba(28,31,33,.06);padding:4px var(--s-2) calc(4px + var(--safe-b));}
.bottom-nav-inner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;max-width:720px;margin:0 auto;}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:6px 4px;border-radius:12px;
  font-family:var(--font-brand);font-size:var(--t-2xs);font-weight:700;color:var(--ink-2);transition:background-color .15s var(--ease),color .15s var(--ease);}
.nav-btn .ic{width:22px;height:22px;}
.nav-btn[aria-current="page"],.nav-btn[aria-expanded="true"]{background:var(--brand-soft);color:var(--brand-ink);}
.nav-btn .run-dot{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid var(--surface);display:none;}

/* ══════════ ESTRUCTURA ══════════ */
.layout{display:block;padding-top:var(--s-6);padding-bottom:calc(var(--nav-h) + var(--s-10) + var(--safe-b));}
main{display:block;min-width:0;max-width:820px;}
main:focus{outline:none;}
#aside{display:none;}

/* Cabecera de pantalla */
.page-head{display:flex;align-items:flex-start;gap:var(--s-3);margin-bottom:var(--s-5);}
.page-head-text{flex:1;min-width:0;}
.page-title{font-family:var(--font-brand);font-size:var(--t-2xl);font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--ink);}
.page-sub{font-size:var(--t-sm);color:var(--ink-3);margin-top:4px;}
.stack > * + *{margin-top:var(--s-4);}

/* Tarjeta */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:var(--s-5);scroll-margin-top:calc(var(--hdr-h) + 16px);}
.card-head{display:flex;align-items:flex-start;gap:var(--s-3);margin-bottom:var(--s-4);}
.card-head-text{flex:1;min-width:0;padding-top:1px;}
.card-title{font-family:var(--font-brand);font-size:var(--t-lg);font-weight:700;line-height:1.3;color:var(--ink);}
.card-sub{font-size:var(--t-sm);color:var(--ink-3);margin-top:2px;line-height:1.45;}
.label{display:block;font-family:var(--font-brand);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px;}
:root.proj .label{font-size:13px;}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);margin:var(--s-5) 0 var(--s-2);}
.label-row .label{margin:0;}
.eyebrow{font-family:var(--font-brand);font-size:var(--t-2xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:44px;padding:0 var(--s-4);
  border-radius:var(--r-md);font-family:var(--font-body);font-size:var(--t-sm);font-weight:700;line-height:1.2;text-align:center;
  transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease);}
.btn .ic{width:18px;height:18px;}
.btn-primary{background:var(--brand-solid);color:#fff;min-height:52px;font-size:var(--t-base);}
.btn-calm{background:var(--inverse);color:var(--inverse-ink);}
.btn-secondary{background:var(--surface);border:1px solid var(--line-2);color:var(--ink);}
.btn-tinted{background:var(--brand-soft);color:var(--brand-ink);}
.btn-quiet{min-height:44px;padding:0 var(--s-2);background:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-weight:600;}
.btn-sm{min-height:40px;padding:0 var(--s-3);font-size:var(--t-xs);border-radius:12px;}
.btn-block{width:100%;}
.btn:active,.chip:active,.nav-btn:active,.opt:active,.case-chip:active{transform:scale(.98);}

/* ---------- Chips ---------- */
.chip-wrap{display:flex;flex-wrap:wrap;gap:var(--s-2);}
.chip{display:inline-flex;align-items:center;gap:var(--s-2);min-height:40px;padding:0 var(--s-4);border-radius:var(--r-pill);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:var(--t-sm);font-weight:600;
  transition:background-color .15s var(--ease),border-color .15s var(--ease);}
.chip .ic{width:16px;height:16px;color:var(--ink-3);}
.chip[aria-pressed="true"]{background:var(--inverse);border-color:var(--inverse);color:var(--inverse-ink);}
.chip[aria-pressed="true"] .ic{color:inherit;}
.chip-other{border-style:dashed;color:var(--ink-2);}
.chip-more{border-color:transparent;background:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:0 var(--s-2);}
.other-row{display:flex;gap:var(--s-2);margin-top:var(--s-3);}
.other-row .input{flex:1;min-width:0;}

/* ---------- Selector de casos ---------- */
.case-strip{display:flex;gap:var(--s-2);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px;margin:-2px -2px var(--s-5);}
.case-strip::-webkit-scrollbar{display:none;}
.case-chip{display:inline-flex;align-items:center;gap:var(--s-2);flex-shrink:0;min-height:40px;padding:0 var(--s-4);border-radius:var(--r-pill);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:var(--t-sm);font-weight:600;white-space:nowrap;
  font-variant-numeric:tabular-nums;transition:background-color .15s var(--ease),border-color .15s var(--ease);}
.case-chip .dot{background:var(--line-2);}
.case-chip.filled .dot{background:var(--ok);}
.case-chip[aria-current="true"]{background:var(--inverse);border-color:var(--inverse);color:var(--inverse-ink);}
.case-chip[aria-current="true"] .dot{box-shadow:0 0 0 2px var(--inverse-ink);}
.case-chip.add{border-style:dashed;color:var(--ink-2);}

/* ---------- Campos ---------- */
.input,textarea.input{width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--line-2);border-radius:12px;
  background:var(--surface);color:var(--ink);font-size:var(--t-base);line-height:1.45;outline:none;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease);}
textarea.input{resize:vertical;min-height:96px;line-height:1.55;overflow:hidden;}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.input::placeholder{color:var(--ink-3);opacity:1;}
.field-grid{display:grid;grid-template-columns:1fr;gap:var(--s-4);}
.case-title-input{font-family:var(--font-brand);font-size:var(--t-xl);font-weight:700;letter-spacing:-.01em;min-height:56px;}
.case-title-input::placeholder{font-family:var(--font-body);font-weight:500;font-size:var(--t-base);}

/* Hipótesis numeradas */
.num-list{display:flex;flex-direction:column;gap:var(--s-3);}
.num-row{display:flex;gap:var(--s-3);align-items:flex-start;}
.num-badge{flex-shrink:0;width:28px;height:28px;margin-top:10px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-brand);font-size:var(--t-xs);font-weight:700;background:var(--surface-hi);color:var(--ink-2);font-variant-numeric:tabular-nums;}
.num-row textarea.input{min-height:72px;}

/* ---------- Opción elegible (tipo de diagnóstico, cierre) ---------- */
.opt-grid{display:grid;grid-template-columns:1fr;gap:var(--s-2);}
.opt{display:flex;align-items:flex-start;gap:var(--s-3);width:100%;min-height:64px;padding:var(--s-3);text-align:left;
  border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);
  transition:background-color .15s var(--ease),border-color .15s var(--ease);}
.opt-text{flex:1;min-width:0;}
.opt-title{display:block;font-family:var(--font-brand);font-size:var(--t-md);font-weight:700;color:var(--ink);line-height:1.3;}
.opt-desc{display:block;margin-top:2px;font-size:var(--t-sm);color:var(--ink-3);line-height:1.4;}
.opt-check{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-top:8px;border-radius:50%;
  border:1.5px solid var(--line-2);color:transparent;}
.opt-check .ic{width:15px;height:15px;stroke-width:2.4;}
.opt[aria-pressed="true"]{border-color:var(--tone);box-shadow:inset 0 0 0 1px var(--tone);background:var(--tone-soft);}
.opt[aria-pressed="true"] .opt-check{background:var(--tone);border-color:var(--tone);color:var(--surface);}

/* ---------- Tratamiento en tres niveles: lista agrupada ---------- */
.group{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;}
.group-row{padding:var(--s-4);border-bottom:1px solid var(--line);}
.group-row:last-child{border-bottom:none;}
.group-row-head{display:flex;align-items:center;gap:var(--s-3);margin-bottom:var(--s-3);}
.group-row-title{font-family:var(--font-brand);font-size:var(--t-md);font-weight:700;color:var(--ink);line-height:1.3;}
.group-row-sub{font-size:var(--t-sm);color:var(--ink-3);}
.group-row textarea.input{min-height:72px;}

/* ---------- Receta final: la frase protagonista ---------- */
.rx-card{border-color:var(--line-2);}
.rx{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-8) var(--s-5) var(--s-5);}
.rx-quote{position:absolute;left:14px;top:2px;font-family:Georgia,'Times New Roman',serif;font-size:52px;line-height:1;color:var(--brand);pointer-events:none;}
.rx-sentence{font-size:var(--t-rx);font-weight:600;line-height:2.05;color:var(--ink);}
.rx-in{display:inline-block;vertical-align:top;resize:none;overflow:hidden;height:auto;min-width:150px;max-width:100%;field-sizing:content;margin:0 2px;padding:0 6px;
  border:none;border-bottom:2px solid var(--line-2);border-radius:6px 6px 0 0;background:transparent;color:var(--ink);
  font:inherit;font-weight:600;line-height:1.5;margin-top:.3em;outline:none;transition:border-color .15s var(--ease),background-color .15s var(--ease);}
.rx-in.wide{min-width:220px;}
.rx-in::placeholder{color:var(--ink-3);font-weight:500;opacity:1;}
.rx-in:focus{border-bottom-color:var(--brand);background:var(--brand-soft);}
.sema{display:grid;grid-template-columns:1fr;gap:var(--s-2);}
.sema .opt{min-height:52px;align-items:center;}
.sema .opt-check{margin-top:0;}
.light{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid var(--tone);background:transparent;}
.opt[aria-pressed="true"] .light{background:var(--tone);}

/* ---------- Avisos ---------- */
.notice{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-3) var(--s-4);border-radius:var(--r-md);
  background:var(--tone-soft,var(--surface-2));color:var(--ink);font-size:var(--t-sm);line-height:1.5;}
.notice > .ic{color:var(--tone,var(--ink-3));margin-top:1px;}
.notice-body{flex:1;min-width:0;}
.notice-actions{margin-top:var(--s-2);display:flex;flex-wrap:wrap;gap:var(--s-2);}
.ficha-foot{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:center;}

/* ---------- Estado vacío ---------- */
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--s-3);text-align:center;padding:var(--s-8) var(--s-5);
  border:1.5px dashed var(--line-2);border-radius:var(--r-lg);color:var(--ink-2);font-size:var(--t-md);line-height:1.55;}
.empty-title{font-family:var(--font-brand);font-size:var(--t-lg);font-weight:700;color:var(--ink);}
.empty-inline{font-size:var(--t-sm);color:var(--ink-3);}

/* ══════════ MAPA DE PATRONES ══════════ */
.cifra{font-family:var(--font-brand);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--tone-ink,var(--ink));}
.cifra-xl{font-size:var(--t-3xl);}
.stat{display:flex;align-items:center;gap:var(--s-4);}
.stat-text{font-size:var(--t-md);color:var(--ink-2);line-height:1.45;}
.map-grid{display:grid;grid-template-columns:1fr;gap:var(--s-4);}
.bars{display:flex;flex-direction:column;gap:var(--s-3);}
.bar-row{display:grid;grid-template-columns:minmax(96px,auto) 1fr 32px;align-items:center;gap:var(--s-3);}
.bar-label{display:flex;align-items:center;gap:var(--s-2);font-size:var(--t-sm);font-weight:600;color:var(--ink);}
.bar-track{height:10px;border-radius:var(--r-pill);background:var(--surface-hi);overflow:hidden;}
.bar-fill{height:100%;border-radius:var(--r-pill);background:var(--tone,var(--ink-3));transition:width .3s var(--ease);}
.bar-n{text-align:right;font-family:var(--font-brand);font-size:var(--t-md);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);}
.freq-list{list-style:none;display:flex;flex-direction:column;}
.freq-list li{padding:var(--s-3) 0;border-bottom:1px solid var(--line);}
.freq-list li:first-child{padding-top:0;}
.freq-list li:last-child{border-bottom:none;padding-bottom:0;}
.freq-top{display:flex;align-items:center;gap:var(--s-2);font-size:var(--t-sm);font-weight:600;color:var(--ink);}
.freq-top .freq-txt{flex:1;min-width:0;}
.freq-top .bar-n{font-size:var(--t-sm);}
.freq-bar{margin-top:6px;height:3px;border-radius:2px;background:var(--surface-hi);overflow:hidden;}
.freq-bar span{display:block;height:100%;background:var(--ink-2);border-radius:2px;}
.learn-list{list-style:none;display:flex;flex-direction:column;}
.learn-list li{display:flex;gap:var(--s-3);padding:var(--s-4) 0;border-bottom:1px solid var(--line);}
.learn-list li:first-child{padding-top:0;}
.learn-list li:last-child{border-bottom:none;padding-bottom:0;}
.learn-title{font-family:var(--font-brand);font-size:var(--t-md);font-weight:700;color:var(--ink);}
.learn-text{font-size:var(--t-md);color:var(--ink-2);line-height:1.6;margin-top:2px;}

/* ══════════ COLUMNA DERECHA: temporizador e índice ══════════ */
.aside-stack > * + *{margin-top:var(--s-4);}
.timer-head{display:flex;align-items:center;gap:var(--s-3);margin-bottom:var(--s-3);}
.timer-head .card-title{flex:1;}
.timer-close{display:none;}
.timer-display{font-family:var(--font-brand);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink);}
:root.proj .timer-display{font-size:60px;}
.timer-display.warn{color:var(--t-amber-ink);}
.timer-display.over{color:var(--bad);}
.timer-step{margin-top:6px;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);}
.timer-state{font-size:var(--t-xs);color:var(--ink-3);margin-top:2px;min-height:18px;}
.timer-state.over{color:var(--bad);font-weight:600;}
.timer-controls{display:grid;grid-template-columns:1fr auto auto;gap:var(--s-2);margin-top:var(--s-4);}
.timer-presets{margin-top:var(--s-4);}
.timer-presets .chip-wrap{gap:6px;}
.timer-presets .chip{min-height:40px;padding:0 var(--s-3);font-size:var(--t-xs);}
.index-list{list-style:none;display:flex;flex-direction:column;}
.index-link{display:flex;align-items:center;gap:var(--s-3);width:100%;min-height:44px;padding:0 var(--s-2);border-radius:10px;text-align:left;
  font-size:var(--t-sm);font-weight:600;color:var(--ink);transition:background-color .15s var(--ease);}
.index-mark{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);color:transparent;}
.index-mark .ic{width:13px;height:13px;stroke-width:2.6;}
.index-link.done .index-mark{background:var(--ok);border-color:var(--ok);color:var(--surface);}
.index-count{font-size:var(--t-xs);color:var(--ink-3);font-variant-numeric:tabular-nums;}

/* ══════════ DIÁLOGO ══════════ */
.dialog-back{position:fixed;inset:0;z-index:1100;display:none;align-items:center;justify-content:center;padding:var(--s-4);background:rgba(27,29,31,.55);}
.dialog-back.open{display:flex;}
.dialog{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-3);padding:var(--s-6);animation:fadeUp .2s var(--ease-out);}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.dialog h2{font-family:var(--font-brand);font-size:var(--t-xl);font-weight:700;color:var(--ink);margin:var(--s-3) 0 var(--s-2);}
.dialog p{font-size:var(--t-md);line-height:1.6;color:var(--ink-2);white-space:pre-line;}
.dialog-actions{display:flex;gap:var(--s-3);justify-content:flex-end;flex-wrap:wrap;margin-top:var(--s-6);}
.dialog-actions .btn{min-height:48px;}

/* ---------- Aviso breve ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + var(--safe-b));z-index:3000;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:var(--s-3);max-width:calc(100vw - 32px);min-height:44px;padding:10px 18px;border-radius:var(--r-pill);
  background:#292C2F;color:#F2F4F4;font-size:var(--t-sm);font-weight:600;box-shadow:var(--sh-3);
  transition:opacity .2s var(--ease),transform .2s var(--ease-out);}
.toast.show{opacity:1;transform:translate(-50%,0);}

#printRoot{display:none;}

/* ══════════ HOVER ══════════ */
@media (hover:hover){
  .icon-btn:hover{background:var(--surface-2);border-color:var(--line-2);}
  .hdr-tab:not([aria-current="page"]):hover,.nav-btn:not([aria-current="page"]):not([aria-expanded="true"]):hover{background:var(--surface-2);color:var(--ink);}
  .drop-item:hover,.index-link:hover{background:var(--surface-2);}
  .btn-primary:hover{background:var(--brand-solid-hover);}
  .btn-calm:hover{background:var(--inverse-hover);}
  .btn-secondary:hover{background:var(--surface-2);border-color:var(--ink-4);}
  .btn-tinted:hover{background:rgba(204,46,52,.13);}
  .btn-quiet:hover{color:var(--ink);}
  .chip:not([aria-pressed="true"]):hover,.case-chip:not([aria-current="true"]):hover{border-color:var(--ink-4);background:var(--surface-2);}
  .chip[aria-pressed="true"]:hover,.case-chip[aria-current="true"]:hover{background:var(--inverse-hover);}
  .opt:not([aria-pressed="true"]):hover{border-color:var(--ink-4);background:var(--surface-2);}
}

/* ══════════ ANCHOS ══════════ */
@media (min-width:480px){
  .field-grid{grid-template-columns:1fr 1fr;}
  .opt-grid{grid-template-columns:1fr 1fr;}
}
@media (min-width:601px){
  :root{--gutter:28px;}
  .sema{grid-template-columns:repeat(3,minmax(0,1fr));}
  .nav-btn{font-size:var(--t-sm);}
}
@media (min-width:720px){
  .map-grid{grid-template-columns:1fr 1fr;}
  .map-grid .full{grid-column:1 / -1;}
  .opt-grid.four{grid-template-columns:repeat(4,minmax(0,1fr));}
  .opt-grid.four .opt{flex-direction:column;gap:var(--s-2);}
  .opt-grid.four .opt-check{position:absolute;top:var(--s-3);right:var(--s-3);margin:0;}
  .opt-grid.four .opt{position:relative;}
  .opt-grid.four .opt-title{padding-right:28px;}
}
@media (min-width:960px){
  .hdr-tabs{display:flex;}
  .bottom-nav{display:none;}
  .layout{padding-bottom:var(--s-10);}
  html{scroll-padding-bottom:24px;}
  .toast{bottom:calc(24px + var(--safe-b));}
  #btnTimerHdr{display:inline-flex;}
}
@media (min-width:1024px){
  #btnTimerHdr{display:none;}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) var(--aside-w);gap:var(--s-8);align-items:start;}
  #aside{display:block;position:sticky;top:calc(var(--hdr-h) + 1px + var(--s-6));max-height:calc(100vh - var(--hdr-h) - 48px);overflow-y:auto;
    padding:2px;margin:-2px;}
}
/* Por debajo de 1024 px el temporizador es una hoja que se abre sobre la barra inferior */
@media (max-width:1023px){
  body.timer-open #aside{display:block;position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));z-index:160;
    padding:0 var(--gutter) var(--s-3);max-height:calc(100vh - var(--hdr-h) - var(--nav-h) - 24px);overflow-y:auto;}
  body.timer-open #indexCard{display:none;}
  body.timer-open .timer-card{max-width:720px;margin:0 auto;box-shadow:var(--sh-3);}
  .timer-close{display:inline-flex;}
}
@media (min-width:960px) and (max-width:1023px){
  body.timer-open #aside{bottom:0;padding-bottom:calc(var(--s-4) + var(--safe-b));}
}
@media (max-width:600px){
  .hdr-logo{height:30px;}
  .card{padding:var(--s-4);}
  .rx{padding:var(--s-8) var(--s-4) var(--s-4);}
  .rx-sentence{line-height:1.7;}
  .rx-in,.rx-in.wide{display:block;width:100%;min-width:0;margin:4px 0 10px;padding:6px 8px;}
  .timer-display{font-size:38px;}
}
@media (max-width:480px){ .hdr-sub{display:none;} }
@media (max-width:379px){ .hdr-names{display:none;} }
@media (max-height:500px) and (max-width:959px){ .nav-btn{min-height:48px;} :root{--nav-h:56px;} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
}

/* ══════════ IMPRESIÓN ══════════ */
@media print{
  @page{size:A4;margin:12mm;}
  :root{--bg:#fff;}
  body{background:#fff;color:#1C1F21;}
  #site-header,.bottom-nav,#aside,.toast,.dialog-back,.skip-link,.no-print{display:none !important;}
  .layout{display:block;padding:0;max-width:none;}
  main{max-width:none;}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid;}
  body.print-cases .layout{display:none !important;}
  body.print-cases #printRoot{display:block;}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
}
/* Hoja de impresión de un caso */
.ps{font-family:var(--font-body);color:#1C1F21;font-size:11pt;line-height:1.45;}
.ps + .ps{page-break-before:always;}
.ps-head{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:2px solid #CC2E34;margin-bottom:14px;}
.ps-head img{height:28px;width:auto;}
.ps-kicker{font-family:var(--font-brand);font-size:8pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#646C69;}
.ps-title{font-family:var(--font-brand);font-size:18pt;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
.ps-sec{break-inside:avoid;page-break-inside:avoid;margin-bottom:12px;}
.ps-label{font-family:var(--font-brand);font-size:8pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4A5250;margin-bottom:3px;}
.ps-text{white-space:pre-wrap;}
.ps-empty{color:#8A918E;}
.ps-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.ps-cols.two{grid-template-columns:repeat(4,1fr);}
.ps-box{border:1px solid #CDD3D2;border-radius:8px;padding:7px 9px;}
.ps-rx{background:#F6F7F7;border:1px solid #CDD3D2;border-left:4px solid #CC2E34;border-radius:8px;padding:10px 12px;font-size:12.5pt;font-weight:600;line-height:1.55;}
.ps-rx b{border-bottom:1.5px solid #1C1F21;}
</style>

function blankCase(){
  return {
    nombre:"", sintomas:"", hip:["","",""], diagTipo:null, vars:[],
    objetivo:"", n1:"", n2:"", n3:"",
    dosis:"", responsable:"", duracion:"", seguimiento:"",
    indics:[], rx1:"", rxCon:"", rx2:"", rx3:"", sema:null,
    cierre:null, aprendizaje:""
  };
}
/* Completa los campos que falten sin tocar los que hay */
function normCase(c){
  const n = Object.assign(blankCase(), c||{});
  if(!Array.isArray(n.hip)) n.hip=["","",""];
  while(n.hip.length<3) n.hip.push("");
  if(!Array.isArray(n.vars)) n.vars=[];
  if(!Array.isArray(n.indics)) n.indics=[];
  return n;
}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function ic(nombre, clase){return '<svg class="ic'+(clase?' '+clase:'')+'" aria-hidden="true"><use href="#i-'+nombre+'"/></svg>';}
function cur(){return cases[current];}
function isFilled(c){
  return !!(c.nombre || c.sintomas || c.diagTipo || c.objetivo || c.n1 || c.rx1 || c.sema || c.cierre);
}
function $(id){return document.getElementById(id);}

/* ── Guardado en este navegador ── */
const KEY = "clinica_rp_fichas_v1";
const KEY_VIEW = "clinica_rp_vista";
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{
      const d = JSON.parse(raw);
      cases = (Array.isArray(d) ? d : (d.cases||[])).map(normCase);
      current = Math.min(Math.max(0, (d && d.current)|0), Math.max(0,cases.length-1));
    }catch(e){
      /* Datos dañados: se apartan en una copia antes de seguir, nunca se pierden en silencio */
      try{ localStorage.setItem(KEY+"_danado_"+Date.now(), raw); }catch(_){}
      setTimeout(()=>toast("Los casos guardados estaban dañados. Se ha apartado una copia y se empieza en blanco."),400);
      cases = [];
    }
  }
  if(!cases.length){ cases = [blankCase()]; current = 0; }
  try{ const v = localStorage.getItem(KEY_VIEW); if(v==="map"||v==="case") view = v; }catch(e){}
}
let saveFailed = false;
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({cases,current}));
    localStorage.setItem(KEY_VIEW, view);
    if(saveFailed){ saveFailed=false; setSub(); }
  }catch(e){
    if(!saveFailed){ saveFailed=true; setSub(); toast("No se ha podido guardar en este navegador. Usa Guardar en archivo."); }
  }
}
function setSub(){
  const s=$("hdrSub");
  s.textContent = saveFailed ? "Sin guardar en este navegador" : "Ficha de diagnóstico y receta";
  s.classList.toggle("bad", saveFailed);
}

  for(let i=0;i<BANCO_COMPLETO.length;i++){ if(!cargados.has(i)){ next=i; break; } }
  if(next===-1){ toast("Ya has cargado los "+BANCO_COMPLETO.length+" casos del banco"); return; }
  const b = BANCO_COMPLETO[next];
  const nuevo = blankCase();
  nuevo.nombre = b.nombre;
  nuevo.sintomas = b.sintomas;
  nuevo._resolucion = JSON.parse(JSON.stringify(b));
  nuevo._bancoIdx = next;
  if(cases.length===1 && !isFilled(cases[0]) && !cases[0]._resolucion){
    cases[0] = nuevo; current = 0;
  } else if(cases.length < 16){
    cases.push(nuevo); current = cases.length - 1;
  } else {
    toast("Has llegado al máximo de 16 casos"); return;
  }
  view="case"; save(); render(); scrollTop();
  toast("Añadido del banco: caso "+(cargados.size+1)+" de "+BANCO_COMPLETO.length);
}
function updateBancoHint(){
  $("bancoHint").textContent = bancoCargados().size+"/"+BANCO_COMPLETO.length;
}
function resolverCase(i){
  const c = cases[i];
  if(!c || !c._resolucion) return;
  confirmModal({
    title:"¿Ver la solución modelo?",
    msg:"Se rellenan el diagnóstico, el tratamiento, la receta y el cierre con la solución del banco. Sirve para enseñar un ejemplo o desbloquear al grupo. Después puedes editar lo que quieras.",
    okText:"Rellenar con la solución", icon:"bulb", tone:"amber",
    onOk:()=>{
      const r = c._resolucion;
      ["hip","diagTipo","vars","objetivo","n1","n2","n3","dosis","responsable",
       "duracion","seguimiento","indics","rx1","rxCon","rx2","rx3","sema","cierre","aprendizaje"
      ].forEach(k=>{ if(r[k]!==undefined) c[k] = JSON.parse(JSON.stringify(r[k])); });
      save(); render();
      toast("Caso rellenado con la solución modelo");
    }
  });
}

/* ── Copia en archivo (.json) — mismo formato que la ficha original ── */
function saveFile(){
  try{
    const data = JSON.stringify({app:"clinica_rp", version:1, fecha:new Date().toISOString(), cases, current}, null, 1);
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    const stamp = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
    a.href = url; a.download = "clinica_rp_"+stamp+".json";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url);}, 100);
    toast("Archivo descargado");
  }catch(e){ toast("No se ha podido crear el archivo"); }
}
function loadFile(ev){
  const input = ev.target;
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let norm;
    try{
      const d = JSON.parse(e.target.result);
      const loaded = Array.isArray(d) ? d : d.cases;
      if(!Array.isArray(loaded) || !loaded.length) throw new Error("formato");
      norm = loaded.map(normCase);
    }catch(err){
      toast("No se ha podido leer el archivo. Elige un .json guardado con esta ficha.");
      input.value=""; return;
    }
    const tieneDatos = cases.some(isFilled);
    confirmModal({
      title:"¿Cargar "+norm.length+(norm.length===1?" caso":" casos")+" del archivo?",
      msg: tieneDatos ? "Sustituye a los casos que tienes ahora. Si quieres conservarlos, cancela y usa antes Guardar en archivo." : "Se abrirán en esta ficha.",
      okText:"Cargar casos", icon:"upload", tone:"neutral",
      onOk:()=>{
        cases = norm; current = 0; view="case"; save(); render(); scrollTop();
        toast(norm.length+(norm.length===1?" caso cargado":" casos cargados")+" del archivo");
      },
      onClose:()=>{ input.value=""; }
    });
  };
  reader.readAsText(file);
}

function countBy(getter){
  const m={};
  cases.forEach(c=>{const v=getter(c);
    if(Array.isArray(v)){v.forEach(x=>{if(x)m[x]=(m[x]||0)+1;});}
    else if(v){m[v]=(m[v]||0)+1;}});
  return m;
}

          <span class="bar-n">${diag[k]||0}</span></div>`).join("")}</div>

      <section class="card" aria-labelledby="m-vars">
        <div class="card-head"><div class="card-head-text"><h2 class="card-title" id="m-vars">Variables que más fallan</h2></div></div>
        ${freqList(vars,maxVar)}
      </section>
      <section class="card" aria-labelledby="m-inds">
        <div class="card-head"><div class="card-head-text"><h2 class="card-title" id="m-inds">Indicadores más usados</h2></div></div>
        ${freqList(inds,maxInd)}
      </section>
      <section class="card" aria-labelledby="m-cierre">
        <div class="card-head"><div class="card-head-text"><h2 class="card-title" id="m-cierre">Cómo se cerraron los casos</h2></div></div>
        ${distList(cierre,CIERRES)}
      </section>
      <section class="card" aria-labelledby="m-sema">
        <div class="card-head"><div class="card-head-text"><h2 class="card-title" id="m-sema">Semáforo de las recetas</h2></div></div>
        ${distList(sema,SEMAS)}
      </section>
      <section class="card full" aria-labelledby="m-aprend">
        <div class="card-head"><span class="tile" data-tone="green">${ic("sprout")}</span>
          <div class="card-head-text"><h2 class="card-title" id="m-aprend">Aprendizajes recogidos</h2></div></div>
        ${aprend.length ? `<ul class="learn-list">${aprend.map(({c,i})=>{const u=c.diagTipo?DTYPE_UI[c.diagTipo]:null;return `<li>
          <span class="tile tile-sm" data-tone="${u?u.tone:'neutral'}"><span class="tile-num">${i+1}</span></span>
          <div><div class="learn-title">${esc(c.nombre||('Caso '+(i+1)))}</div><p class="learn-text">${esc(c.aprendizaje)}</p></div></li>`;}).join("")}</ul>`
          : `<p class="empty-inline">Los aprendizajes que escribas en cada caso aparecerán aquí.</p>`}
      </section>
    </div>
    <div class="ficha-foot no-print"><button type="button" class="btn btn-secondary" data-act="print-map">${ic("printer")}Descargar PDF del mapa</button></div>`}
  </div>`;
}

/* ══════════ ACCIONES ══════════ */
let pendingFocus = null;
function rerender(focusSel){ pendingFocus = focusSel||null; render();
  if(pendingFocus){ const el=document.querySelector(pendingFocus); if(el) el.focus({preventScroll:true}); pendingFocus=null; } }
function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }
function cssq(v){ return String(v).replace(/\\/g,"\\\\").replace(/"/g,'\\"'); }

function toggleIn(kind, v){
  const c=cur(); const arr=c[kind]; const i=arr.indexOf(v);
  i>=0?arr.splice(i,1):arr.push(v);
  save();
  const base = kind==="vars"?VARS:INDICS;
  rerender(base.includes(v)||arr.includes(v) ? `[data-act="chip"][data-kind="${kind}"][data-val="${cssq(v)}"]` : `[data-act="other"][data-kind="${kind}"]`);
}
function addOther(kind){
  const el=$("other-"+kind); if(!el) return;
  const v=el.value.trim();
  if(!v){ toast(kind==="vars"?"Escribe la variable antes de añadirla":"Escribe el indicador antes de añadirlo"); el.focus(); return; }
  const c=cur();
  if(c[kind].some(x=>x.toLowerCase()===v.toLowerCase())){ toast(kind==="vars"?"Esa variable ya está marcada":"Ese indicador ya está marcado"); el.value=""; el.focus(); return; }
  const base = kind==="vars"?VARS:INDICS;
  const match = base.find(x=>x.toLowerCase()===v.toLowerCase());
  c[kind].push(match||v);
  if(match) ui.expand[kind]=true;
  save(); rerender("#other-"+kind);
  toast(kind==="vars"?"Variable añadida":"Indicador añadido");
}
function goCase(i){ if(i<0||i>=cases.length) return; view="case"; current=i; ui.other={vars:false,indics:false}; save(); render(); scrollTop(); }
function goView(v){ view=v; save(); render(); scrollTop(); $("main").focus({preventScroll:true}); }
function addCase(){
  if(cases.length>=12){ toast("Has llegado al máximo de 12 casos"); return; }
  view="case"; cases.push(blankCase()); current=cases.length-1; save(); render(); scrollTop();
  toast("Caso "+cases.length+" añadido");
  setTimeout(()=>{const f=$("f_nombre"); if(f) f.focus({preventScroll:true});},50);
}
function deleteCase(i){
  if(cases.length<=1) return;
  const c=cases[i];
  confirmModal({
    title:"¿Borrar el caso "+(i+1)+"?",
    msg: isFilled(c) ? "Tiene contenido y no se puede deshacer. Si quieres conservarlo, usa antes Guardar en archivo." : "Está vacío.",
    okText:"Borrar caso", icon:"trash", tone:"brand",
    onOk:()=>{
      cases.splice(i,1);
      if(current>=cases.length) current=cases.length-1;
      else if(i<current) current--;
      save(); render(); toast("Caso borrado");
    }
  });
}
function clearCase(){
  confirmModal({
    title:"¿Vaciar el caso "+(current+1)+"?",
    msg:"Se borra todo lo escrito en este caso. No se puede deshacer.",
    okText:"Vaciar caso", icon:"refresh", tone:"brand",
    onOk:()=>{ cases[current]=blankCase(); save(); render(); toast("Caso vaciado"); }
  });
}

/* ── Tema y proyección ── */

}

  document.documentElement.setAttribute("data-theme", dark?"light":"dark");
  try{ localStorage.setItem("clinica_rp_tema", dark?"light":"dark"); }catch(e){}

}

/* ── Menú ── */
let menuOpener=null;
function openMenu(){ const d=$("hdrDropdown"); d.classList.add("open"); $("btnMenu").setAttribute("aria-expanded","true");
  const first=d.querySelector(".drop-item:not([hidden])"); if(first) first.focus(); }
function closeMenu(focusBack){ const d=$("hdrDropdown"); if(!d.classList.contains("open")) return; d.classList.remove("open"); $("btnMenu").setAttribute("aria-expanded","false"); if(focusBack) $("btnMenu").focus(); }

/* ── Temporizador ── */
const TIMER_PRESETS=[
  {label:"Caso completo",secs:900},
  {label:"1 · Lectura",secs:60},
  {label:"2 · Aclaración",secs:120},
  {label:"3 · Síntoma/causa",secs:180},
  {label:"4 · Dif.",secs:120},
  {label:"6 · Objetivo",secs:60},
  {label:"7 · Tratamiento",secs:240},
  {label:"8 · Validación",secs:120},
];
let timer={total:900,remaining:900,running:false,interval:null,label:"Caso completo"};
function fmt(s){const m=Math.floor(Math.abs(s)/60),ss=Math.abs(s)%60;return (s<0?"-":"")+m+":"+String(ss).padStart(2,"0");}
function renderTimerPresets(){
  $("timerPresets").innerHTML=TIMER_PRESETS.map((p,i)=>`<button type="button" class="chip" data-act="timer-set" data-i="${i}" aria-pressed="${timer.label===p.label}">${esc(p.label)} · ${fmt(p.secs)}</button>`).join("");
}
function renderTimer(){
  const d=$("timerDisplay");
  d.textContent=fmt(timer.remaining);
  d.classList.toggle("warn",timer.remaining<=30&&timer.remaining>0);
  d.classList.toggle("over",timer.remaining<0);
  $("timerStep").textContent=timer.label;
  const st=$("timerState");
  st.classList.toggle("over",timer.remaining<0);
  st.textContent = timer.remaining<0 ? "Tiempo cumplido" : (timer.running ? "En marcha" : (timer.remaining<timer.total ? "En pausa" : ""));
  const b=$("tbtnStart");
  b.innerHTML = timer.running ? ic("pause")+"<span>Pausar</span>" : ic("play","ic-fill")+"<span>"+(timer.remaining<timer.total?"Seguir":"Iniciar")+"</span>";
  document.body.classList.toggle("timer-running", timer.running);
}
function timerTick(){
  timer.remaining--;
  if(timer.remaining===0){toast("Tiempo cumplido: "+timer.label);try{beep();}catch(e){}}
  renderTimer();
}
function timerStartPause(){
  if(timer.running){clearInterval(timer.interval);timer.running=false;}
  else{timer.running=true;timer.interval=setInterval(timerTick,1000);}
  renderTimer();
}
function timerReset(){clearInterval(timer.interval);timer.running=false;timer.remaining=timer.total;renderTimer();}
function timerSet(i){const p=TIMER_PRESETS[i]; if(!p) return; clearInterval(timer.interval);timer.running=false;
  timer.label=p.label;timer.total=p.secs;timer.remaining=p.secs;renderTimerPresets();renderTimer();}
function timerAdd(s){timer.remaining+=s;timer.total+=s;renderTimer();}
let timerOpener=null;
function toggleTimerSheet(force){
  const open = typeof force==="boolean" ? force : !document.body.classList.contains("timer-open");
  if(open && window.matchMedia("(min-width:1024px)").matches){ $("tbtnStart").focus(); return; }
  if(open) timerOpener=document.activeElement;
  document.body.classList.toggle("timer-open", open);
  ["btnTimerNav","btnTimerHdr"].forEach(id=>$(id).setAttribute("aria-expanded", String(open)));
  if(open) setTimeout(()=>$("tbtnStart").focus(),30);
  else if(timerOpener && timerOpener.focus){ timerOpener.focus(); timerOpener=null; }
}
function beep(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type="sine";
  g.gain.setValueAtTime(.25,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);
  o.start();o.stop(ctx.currentTime+.5);
}

/* ── Aviso breve ── */
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),3000);
}

/* ── Diálogo de confirmación propio (atrapa el foco, Escape cierra, devuelve el foco) ── */
function confirmModal(o){
  const back=$("dialogBack"), ok=$("dialogOk"), cancel=$("dialogCancel");
  const opener=document.activeElement && document.activeElement!==document.body ? document.activeElement : $("btnMenu");
  $("dialogTitle").textContent=o.title||"";
  $("dialogMsg").textContent=o.msg||"";
  $("dialogTile").setAttribute("data-tone", o.tone||"neutral");
  $("dialogTile").innerHTML = ic(o.icon||"info");
  ok.innerHTML = (o.icon?ic(o.icon):"")+esc(o.okText||"Confirmar");
  back.classList.add("open");
  setTimeout(()=>cancel.focus(),20);
  let done=false;
  function close(accepted){
    if(done) return; done=true;
    back.classList.remove("open");
    ok.removeEventListener("click", onOk); cancel.removeEventListener("click", onCancel);
    document.removeEventListener("keydown", onKey, true); back.removeEventListener("click", onBg);
    if(typeof o.onClose==="function") o.onClose();
    if(accepted && typeof o.onOk==="function") o.onOk();
    const back2 = document.contains(opener) ? opener : $("main");
    if(back2 && back2.focus) back2.focus({preventScroll:true});
  }
  function onOk(){ close(true); }
  function onCancel(){ close(false); }
  function onBg(e){ if(e.target===back) close(false); }
  function onKey(e){
    if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); close(false); }
    else if(e.key==="Tab"){
      const f=[cancel,ok]; const i=f.indexOf(document.activeElement);
      e.preventDefault(); f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus();
    }
  }
  ok.addEventListener("click", onOk); cancel.addEventListener("click", onCancel);
  document.addEventListener("keydown", onKey, true); back.addEventListener("click", onBg);
}

/* ══════════ PDF ══════════ */
function psText(v){ return (v||"").trim() ? `<div class="ps-text">${esc(v)}</div>` : `<div class="ps-empty">—</div>`; }
function caseSheetHTML(c, idx){
  const d = c.diagTipo ? DTYPES.find(x=>x.k===c.diagTipo) : null;
  const cier = CIERRES.find(x=>x.k===c.cierre);
  const sem = SEMAS.find(x=>x.k===c.sema);
  const blank = v => (v||"").trim() ? `<b>${esc(v)}</b>` : `<b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</b>`;
  return `<article class="ps">
    <div class="ps-head"><img src="${LOGO_SRC}" alt="">
      <div><div class="ps-kicker">Clínica de soluciones · Caso ${idx+1}</div><div class="ps-title">${esc(c.nombre||"Sin título")}</div></div></div>
    <div class="ps-sec"><div class="ps-label">Qué está pasando</div>${psText(c.sintomas)}</div>
    <div class="ps-sec"><div class="ps-label">Diagnóstico diferencial</div>
      <div class="ps-cols">${[0,1,2].map(i=>`<div class="ps-box"><div class="ps-label">Hipótesis ${i+1}</div>${psText(c.hip[i])}</div>`).join("")}</div></div>
    <div class="ps-sec"><div class="ps-label">Diagnóstico principal</div>
      <div>${d?`<strong>${DTYPE_UI[d.k].t}</strong> · ${esc(d.d)}`:`<span class="ps-empty">—</span>`}</div>
      <div style="margin-top:4px"><span class="ps-label" style="display:inline">Variable que falla:</span> ${c.vars.length?esc(c.vars.join(" · ")):'<span class="ps-empty">—</span>'}</div></div>
    <div class="ps-sec"><div class="ps-label">Objetivo de intervención</div>${psText(c.objetivo)}</div>
    <div class="ps-sec"><div class="ps-label">Tratamiento</div>
      <div class="ps-cols">${NIVELES.map(l=>`<div class="ps-box"><div class="ps-label">${l.n} · ${l.t}</div>${psText(c["n"+l.n])}</div>`).join("")}</div>
      <div class="ps-cols two" style="margin-top:8px">
        ${[["Dosis","dosis"],["Responsable","responsable"],["Duración","duracion"],["Seguimiento","seguimiento"]].map(([t,k])=>`<div class="ps-box"><div class="ps-label">${t}</div>${psText(c[k])}</div>`).join("")}</div></div>
    <div class="ps-sec"><div class="ps-label">Indicadores de mejora</div><div>${c.indics.length?esc(c.indics.join(" · ")):'<span class="ps-empty">—</span>'}</div></div>
    <div class="ps-sec"><div class="ps-label">Receta final</div>
      <div class="ps-rx">“En el próximo turno voy a hacer ${blank(c.rx1)} con ${blank(c.rxCon)}, de esta manera ${blank(c.rx2)}, y revisaré si ha funcionado mirando ${blank(c.rx3)}.”</div>
      <div style="margin-top:6px"><span class="ps-label" style="display:inline">Semáforo:</span> ${sem?`${sem.t} — ${sem.d}`:'<span class="ps-empty">—</span>'}</div></div>
    <div class="ps-sec"><div class="ps-label">Cierre del caso</div><div>${cier?`<strong>${cier.t}</strong> · ${cier.d}`:'<span class="ps-empty">—</span>'}</div></div>
    ${(c.aprendizaje||"").trim()?`<div class="ps-sec"><div class="ps-label">Aprendizaje para todo el grupo</div>${psText(c.aprendizaje)}</div>`:""}
  </article>`;
}
function printCases(list){
  $("printRoot").innerHTML = list.map(i=>caseSheetHTML(cases[i],i)).join("");
  document.body.classList.add("print-cases");
  window.print();
}
window.addEventListener("afterprint", ()=>{ document.body.classList.remove("print-cases"); $("printRoot").innerHTML=""; });

/* ══════════ EVENTOS ══════════ */
document.addEventListener("click", e=>{
  const dd=$("hdrDropdown");
  if(dd.classList.contains("open") && !e.target.closest(".hdr-actions")) closeMenu(false);
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const a = t.dataset.act;
  const inMenu = !!t.closest("#hdrDropdown");
  if(inMenu) closeMenu(false);
  const c = cur();
  switch(a){
    case "view": goView(t.dataset.view); break;
    case "go": goCase(+t.dataset.i); break;
    case "add": addCase(); break;
    case "banco": loadBanco(); break;
    case "resolver": resolverCase(current); break;
    case "print-one": if(view!=="case"){ goView("case"); } printCases([current]); break;
    case "print-all": printCases(cases.map((_,i)=>i)); break;
    case "print-map": window.print(); break;
    case "save-file": saveFile(); break;
    case "load-file": $("loadFileInput").click(); break;
    case "clear": clearCase(); break;
    case "delete": deleteCase(current); break;
    case "theme": toggleTheme(); break;
    case "proj": toggleProj(); break;
    case "menu": $("hdrDropdown").classList.contains("open") ? closeMenu(true) : openMenu(); break;
    case "diag": c.diagTipo = (c.diagTipo===t.dataset.k?null:t.dataset.k); save(); rerender(`[data-act="diag"][data-k="${t.dataset.k}"]`); break;
    case "sema": c.sema = (c.sema===t.dataset.k?null:t.dataset.k); save(); rerender(`[data-act="sema"][data-k="${t.dataset.k}"]`); break;
    case "cierre": c.cierre = (c.cierre===t.dataset.k?null:t.dataset.k); save(); rerender(`[data-act="cierre"][data-k="${t.dataset.k}"]`); break;
    case "chip": toggleIn(t.dataset.kind, t.dataset.val); break;
    case "more": { const k=t.dataset.kind; ui.expand[k]=!ui.expand[k];
      rerender(document.querySelector(`[data-act="more"][data-kind="${k}"]`) ? `[data-act="more"][data-kind="${k}"]` : `[data-act="other"][data-kind="${k}"]`);
      if(!document.activeElement || document.activeElement===document.body){ const o=document.querySelector(`[data-act="more"][data-kind="${k}"],[data-act="other"][data-kind="${k}"]`); if(o) o.focus({preventScroll:true}); }
      break; }
    case "other": { const k=t.dataset.kind; ui.other[k]=!ui.other[k]; rerender(ui.other[k]?"#other-"+k:`[data-act="other"][data-kind="${k}"]`); break; }
    case "other-add": addOther(t.dataset.kind); break;
    case "jump": { const s=$(t.dataset.id); if(s){ s.scrollIntoView({behavior:"smooth",block:"start"}); const f=s.querySelector("textarea,input,button.opt"); if(f) setTimeout(()=>f.focus({preventScroll:true}),350); } break; }
    case "timer-toggle": toggleTimerSheet(); break;
    case "timer-start": timerStartPause(); break;
    case "timer-reset": timerReset(); break;
    case "timer-add": timerAdd(60); break;
    case "timer-set": timerSet(+t.dataset.i); break;
  }
});
$("main").addEventListener("input", e=>{
  const t=e.target, c=cur();
  if(!c || view!=="case") return;
  if(t.tagName==="TEXTAREA") autosize(t);
  if(t.dataset.f){ c[t.dataset.f]=t.value; save(); renderIndex(); }
  else if(t.dataset.hip!==undefined){ c.hip[+t.dataset.hip]=t.value; save(); renderIndex(); }
});
$("main").addEventListener("keydown", e=>{
  const t=e.target;
  if(e.key==="Enter" && t.dataset && t.dataset.other){ e.preventDefault(); addOther(t.dataset.other); }
  else if(e.key==="Enter" && t.classList && t.classList.contains("rx-in")) e.preventDefault();
});
$("loadFileInput").addEventListener("change", loadFile);
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if($("dialogBack").classList.contains("open")) return;
  if($("hdrDropdown").classList.contains("open")){ closeMenu(true); return; }
  if(document.body.classList.contains("timer-open")) toggleTimerSheet(false);
});
/* Menú: flechas para moverse entre opciones */
$("hdrDropdown").addEventListener("keydown", e=>{
  if(e.key!=="ArrowDown" && e.key!=="ArrowUp" && e.key!=="Tab") return;
  const items=[...$("hdrDropdown").querySelectorAll(".drop-item:not([hidden])")];
  const i=items.indexOf(document.activeElement);
  if(e.key==="Tab"){ closeMenu(false); return; }
  e.preventDefault();
  items[(i+(e.key==="ArrowDown"?1:-1)+items.length)%items.length].focus();
});
window.addEventListener("resize", ()=>{
  if(view==="case") autosizeAll();
  if(document.body.classList.contains("timer-open") && window.matchMedia("(min-width:1024px)").matches){
    document.body.classList.remove("timer-open");
    ["btnTimerNav","btnTimerHdr"].forEach(id=>$(id).setAttribute("aria-expanded","false"));
  }
});

/* ── Inicio ── */
load(); applyThemeUi(); setSub(); render(); renderTimerPresets(); renderTimer();
</script>
